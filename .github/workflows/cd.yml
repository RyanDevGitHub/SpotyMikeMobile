name: 🚀 CD - Ionic/Angular Build, Push & Deploy

on:
  push:
    branches: ["main"]

# Permissions pour le GITHUB_TOKEN (pour le PUSH)
permissions:
  contents: read
  packages: write

jobs:
  # ===============================================
  # JOB 1: BUILD, TAG & PUSH L'IMAGE DOCKER (GHCR)
  # ===============================================
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ... (Setup Buildx et Définition du nom de dépôt inchangés)

      # Login utilisant GITHUB_TOKEN (avec permission de PUSH)
      - name: 🔑 Login to GHCR (Push via GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construction et PUSH de l'image
      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # ... (tags, cache inchangés)

  # ===============================================
  # JOB 2: DÉPLOIEMENT SUR LE VPS VIA SSH
  # ===============================================
  deploy:
    name: "🚀 Deploy to VPS"
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            # --- Variables ---
            CONTAINER_NAME="ionic-app-container"
            REPO_FULL_NAME="${{ github.repository }}" 
            IMAGE_REPO_LOWERCASE=$(echo "$REPO_FULL_NAME" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/$IMAGE_REPO_LOWERCASE:latest"

            # 🚨 NOUVEAU : Le port Hôte que Nginx utilisera pour la redirection
            HOST_PORT="8087" 

            # 1. Login sur le VPS pour PULL l'image privée
            echo "Authentification Docker pour GHCR..."
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Arrêt et suppression de l'ancien conteneur
            echo "Arrêt et suppression de l'ancien conteneur ($CONTAINER_NAME)..."
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            # 3. Pull la dernière image
            echo "Pull de la dernière image ($IMAGE_NAME)..."
            docker pull $IMAGE_NAME

            # 4. Lancement du nouveau conteneur (Utilisation du Port Mapping)
            echo "Lancement du nouveau conteneur sur le port $HOST_PORT (Hôte)..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $HOST_PORT:80 \ # <-- Port Mapping ajouté !
              $IMAGE_NAME
              
            # 5. Déconnexion Docker
            echo "Déconnexion Docker..."
            docker logout ghcr.io

            # 6. Nettoyage des images non utilisées
            echo "Nettoyage des anciennes images..."
            docker image prune -f

            # 7. Vérification finale
            echo "Vérification du lancement du conteneur :"
            docker ps -f name=$CONTAINER_NAME
