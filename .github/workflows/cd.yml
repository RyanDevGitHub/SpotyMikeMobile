name: 🚀 CD - Ionic/Angular Build, Push & Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Image Repository Name (Lowercase)
        id: repo_name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login to GHCR (Push via GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.IMAGE_REPO }}:latest
            ghcr.io/${{ steps.repo_name.outputs.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "Deploy to VPS"
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            CONTAINER_NAME="ionic-app-container"
            REPO_FULL_NAME="${{ github.repository }}" 
            IMAGE_REPO_LOWERCASE=$(echo "$REPO_FULL_NAME" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/$IMAGE_REPO_LOWERCASE:latest"
            HOST_PORT="8087" 

            echo "Authentification Docker pour GHCR..."
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Arrêt et suppression de l'ancien conteneur ($CONTAINER_NAME)..."
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            echo "Pull de la dernière image ($IMAGE_NAME)..."
            docker pull $IMAGE_NAME

            echo "Lancement du nouveau conteneur sur le port $HOST_PORT (Hôte)..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $HOST_PORT:80 \
              $IMAGE_NAME
              
            echo "Déconnexion Docker..."
            docker logout ghcr.io

            echo "Nettoyage des anciennes images..."
            docker image prune -f

            echo "Vérification du lancement du conteneur :"
            docker ps -f name=$CONTAINER_NAME
