name: 🚀 CD - Ionic/Angular Build, Push & Deploy

on:
  push:
    branches: ["main"]

# Permissions nécessaires pour le jeton par défaut (GITHUB_TOKEN)
# Ceci donne le droit d'écrire (PUSH) sur ghcr.io
permissions:
  contents: read
  packages: write # <--- La clé pour résoudre l'erreur de PUSH

jobs:
  # ===============================================
  # JOB 1: BUILD, TAG & PUSH L'IMAGE DOCKER (GHCR)
  # ===============================================
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ⬇️ Set Image Repository Name (Lowercase)
        id: repo_name
        # Cette commande bash convertit le nom du dépôt en minuscules.
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      # 1. Login to GHCR : UTILISE LE GITHUB_TOKEN par défaut
      # Ce jeton hérite de 'packages: write' défini en haut, donc le PUSH fonctionnera.
      - name: 🔑 Login to GHCR (Push via GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # UTILISATION DU GITHUB_TOKEN PAR DÉFAUT (qui a maintenant les permissions nécessaires)
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Construction de l'image et ajout de tags
      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.IMAGE_REPO }}:latest
            ghcr.io/${{ steps.repo_name.outputs.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===============================================
  # JOB 2: DÉPLOIEMENT SUR LE VPS VIA SSH
  # ===============================================
  deploy:
    name: "🚀 Deploy to VPS"
    runs-on: ubuntu-latest
    # Dépend du succès du build
    needs: docker-build-push

    steps:
      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}

          # Script exécuté sur le VPS
          script: |
            CONTAINER_NAME="ionic-app-container"
            REPO_FULL_NAME="${{ github.repository }}" 

            # 🚨 CORRECTION : Conversion du nom du dépôt en minuscules. 
            # La commande 'tr' est universelle sur les systèmes Linux.
            IMAGE_REPO_LOWERCASE=$(echo "$REPO_FULL_NAME" | tr '[:upper:]' '[:lower:]')

            IMAGE_NAME="ghcr.io/$IMAGE_REPO_LOWERCASE:latest" # <-- Utilisation de la variable corrigée
            NETWORK_NAME="mon_reseau_web" # Assurez-vous que ce nom est correct sur votre VPS

            # 1. Login sur le VPS pour PULL l'image privée
            echo "Authentification Docker pour GHCR..."
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Arrêt et suppression de l'ancien conteneur
            # Le message "No such container" est ignoré grâce à '|| true'
            echo "Arrêt et suppression de l'ancien conteneur ($CONTAINER_NAME)..."
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            # 3. Pull la dernière image (nom d'image corrigé)
            echo "Pull de la dernière image ($IMAGE_NAME)..."
            docker pull $IMAGE_NAME

            # 4. Lancement du nouveau conteneur (nom d'image corrigé)
            echo "Lancement du nouveau conteneur sur le réseau ($NETWORK_NAME)..."
            docker run -d \
             --name $CONTAINER_NAME \
             --restart unless-stopped \
             --network $NETWORK_NAME \
             $IMAGE_NAME
             
            # 5. Déconnexion Docker (Sécurité)
            echo "Déconnexion Docker..."
            docker logout ghcr.io

            # 6. Nettoyage des images non utilisées
            echo "Nettoyage des anciennes images..."
            docker image prune -f

            # 7. Vérification finale
            echo "Vérification du lancement du conteneur :"
            docker ps -f name=$CONTAINER_NAME
